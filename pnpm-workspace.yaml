packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - core-js
  - esbuild
  - sharp

# Only install packages after they've been published for 1+ days
minimumReleaseAge: 1440

catalog:
  # Dev tooling
  eslint: ^9.39.2
  prettier: ^3.7.4
  tailwindcss: ^4.1.18
  typescript: ^5.9.3

  # Misc
  zod: ^4.3.4
  'superjson': 2.2.6
  'sharp': 0.34.5

  # Tanstack & tRPC
  '@tanstack/react-query': ^5.90.16
  '@trpc/client': ^11.8.1
  '@trpc/react-query': ^11.8.1
  '@trpc/server': ^11.8.1

catalogs:
  react19:
    react: 19.2.3
    react-dom: 19.2.3
    '@types/react': ^19.2.7
    '@types/react-dom': ^19.2.3
