packages:
  - apps/*
  - packages/*

allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  '@tanstack/react-query': ^5.102.8
  '@trpc/client': ^11.18.0
  '@trpc/react-query': ^11.18.0
  '@trpc/server': ^11.18.0
  eslint: ^10.9.1
  prettier: ^3.9.6
  sharp: 0.34.5
  superjson: 2.2.6
  tailwindcss: ^4.3.0
  typescript: ^6.0.3
  zod: ^4.4.3

catalogs:
  react19:
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.5
    react: ^19.2.8
    react-dom: ^19.2.8

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1141.0'
  - '@aws-sdk/s3-request-presigner@3.1141.0'
  - '@types/node@26.6.3'
  - dotenv@18.0.4
  - react-hook-form@7.89.0
  - react-native-pager-view@9.0.5
  - react-native-web@0.21.3
  - resend@6.30.0
